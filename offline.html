<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d5c4d">
<title>오프라인 상태입니다 — Song Piano Studio Manager</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#faf9f7; color:#e8ebf0; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  .box { text-align:center; padding:32px; max-width:340px; }
  .box h1 { font-size:20px; margin:0 0 12px; color:#fff; }
  .box p { font-size:15px; line-height:1.6; color:#8a94a1; margin:0 0 20px; }
  button { background:#1d5c4d; color:#fff; border:0; border-radius:12px;
           font-size:16px; padding:12px 28px; cursor:pointer; }
</style>
</head>
<body>
<div class="box">
  <h1>오프라인 상태입니다</h1>
  <p>인터넷에 연결되면 최신 수업 정보가 표시됩니다. 이미 열어 둔 화면은 계속 사용할 수 있어요.</p>
  <button onclick="location.reload()">다시 시도</button>
</div>
</body>
</html>
